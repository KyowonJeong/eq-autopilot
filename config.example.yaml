# EQ-Exec config — copy to config.yaml and fill in YOUR OWN values. Keep config.yaml private
# (it holds broker credentials). config.yaml is gitignored.

live: false              # false = DRY-RUN (no orders sent). Set true ONLY after demo-testing.
broker: projectx         # projectx (Topstep, Phase 1)  |  tradovate (Lucid/Apex, Phase 2)

# ── ProjectX (TopstepX). Get an API key from your ProjectX/TopstepX account (API add-on). ──
projectx:
  base_url: "https://api.topstepx.com"   # ProjectX is per-firm; this is TopstepX
  user_name: "YOUR_TOPSTEPX_USERNAME"
  api_key: "YOUR_PROJECTX_API_KEY"
  accounts: []           # [] = every active account; or ["PRACTICEACCT123", ...] to limit

# ── Tradovate (Phase 2 — Lucid/Apex/etc.). Only used when broker: tradovate. ──
tradovate:
  env: demo              # demo | live
  name: ""
  password: ""
  app_id: "EQ-Exec"
  app_version: "0.1.0"
  cid: ""
  sec: ""
  device_id: ""
  accounts: []

# When to flatten. 24-hour "HH:MM" in the timezone below.
schedule:
  tz: "America/New_York"
  cutoffs:
    - "15:55"            # example: flatten 5 min before the 16:00 ET cash close

poll_seconds: 20
log_file: "eqexec.log"
